# AI Gateway routing table.
# Format: "<department>.<task_type>" -> ordered fallback chain of [provider, model].
# Changing provider/model assignments = edit this file only. No code changes,
# no redeploys of agent logic. Per-tenant overrides can layer on top of this
# (see tenant.ai_provider_overrides_encrypted) for white-label customers who
# bring their own API keys.

default_fallback_chain:
  - provider: ollama
    model: qwen2.5:14b

# Used by AIGateway.embed() for the RAG knowledge base. Ollama first
# (free, local, no key needed -- good default for Termux/dev); Voyage,
# OpenAI, and Gemini as production fallbacks for tenants who don't run
# local models. Only providers with a configured API key are ever
# registered (see gateway.py's build_default_gateway), so an
# unconfigured entry here is skipped exactly like a down provider, not
# an error.
embedding_fallback_chain:
  - provider: ollama
    model: nomic-embed-text
  - provider: voyage
    model: voyage-3-lite
  - provider: openai
    model: text-embedding-3-small
  - provider: gemini
    model: text-embedding-004

departments:
  engineering:
    code_generation:
      - provider: claude
        model: claude-sonnet-4-6
      - provider: ollama
        model: qwencoder:latest
    code_review:
      - provider: claude
        model: claude-sonnet-4-6
      - provider: openrouter
        model: google/gemini-2.5-pro

  quality_assurance:
    test_analysis:
      - provider: claude
        model: claude-sonnet-4-6
      - provider: openrouter
        model: google/gemini-2.5-pro

  general_operations:
    default:
      - provider: ollama
        model: qwen2.5:14b
      - provider: ollama
        model: deepseek-r1:14b
      - provider: gemini
        model: gemini-2.5-flash
      - provider: openrouter
        model: meta-llama/llama-3.3-70b

  executive_office:
    briefing_synthesis:
      - provider: claude
        model: claude-sonnet-4-6
      - provider: gemini
        model: gemini-2.5-flash
      - provider: ollama
        model: qwen2.5:14b
